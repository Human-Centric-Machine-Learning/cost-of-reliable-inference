[run]
name = "main"
output_dir = "outputs"
master_seed = 20260826
repetitions = 50
audit_rep = 0        # repetition whose full round log is written
full_log = false     # also persist per-provider state for every repetition

[data]
root = "datasets"
rewards_root = "rewards"

[rosters]
# The nine base models.
full = [
  "Llama-3-8B", "Llama-3.1-8B", "Llama-3.2-1B", "Llama-3.2-3B",
  "Qwen2-0.5B", "Qwen2-1.5B", "Qwen2-7B", "Qwen2.5-3B", "Qwen2.5-7B",
]
# Four base models spread across the landscape, each at N = 1, 2, 4.
ladder = [
  "Llama-3-8B", "Llama-3-8B@2", "Llama-3-8B@4",
  "Llama-3.2-1B", "Llama-3.2-1B@2", "Llama-3.2-1B@4",
  "Qwen2-1.5B", "Qwen2-1.5B@2", "Qwen2-1.5B@4",
  "Qwen2.5-7B", "Qwen2.5-7B@2", "Qwen2.5-7B@4",
]
# Every base model at every N.
all = [
  "Llama-3-8B", "Llama-3-8B@2", "Llama-3-8B@4", "Llama-3-8B@8", "Llama-3-8B@16", "Llama-3-8B@32", "Llama-3-8B@64",
  "Llama-3.1-8B", "Llama-3.1-8B@2", "Llama-3.1-8B@4", "Llama-3.1-8B@8", "Llama-3.1-8B@16", "Llama-3.1-8B@32", "Llama-3.1-8B@64",
  "Llama-3.2-1B", "Llama-3.2-1B@2", "Llama-3.2-1B@4", "Llama-3.2-1B@8", "Llama-3.2-1B@16", "Llama-3.2-1B@32", "Llama-3.2-1B@64",
  "Llama-3.2-3B", "Llama-3.2-3B@2", "Llama-3.2-3B@4", "Llama-3.2-3B@8", "Llama-3.2-3B@16", "Llama-3.2-3B@32", "Llama-3.2-3B@64",
  "Qwen2-0.5B", "Qwen2-0.5B@2", "Qwen2-0.5B@4", "Qwen2-0.5B@8", "Qwen2-0.5B@16", "Qwen2-0.5B@32", "Qwen2-0.5B@64",
  "Qwen2-1.5B", "Qwen2-1.5B@2", "Qwen2-1.5B@4", "Qwen2-1.5B@8", "Qwen2-1.5B@16", "Qwen2-1.5B@32", "Qwen2-1.5B@64",
  "Qwen2-7B", "Qwen2-7B@2", "Qwen2-7B@4", "Qwen2-7B@8", "Qwen2-7B@16", "Qwen2-7B@32", "Qwen2-7B@64",
  "Qwen2.5-3B", "Qwen2.5-3B@2", "Qwen2.5-3B@4", "Qwen2.5-3B@8", "Qwen2.5-3B@16", "Qwen2.5-3B@32", "Qwen2.5-3B@64",
  "Qwen2.5-7B", "Qwen2.5-7B@2", "Qwen2.5-7B@4", "Qwen2.5-7B@8", "Qwen2.5-7B@16", "Qwen2.5-7B@32", "Qwen2.5-7B@64",
]

# Theta is a midpoint between adjacent provider qualities in the roster;
# T_max is the number of questions, i.e. one pass over the benchmark. An
# environment may set resample = true to run T_max beyond the question count:
# the stream then continues through fresh seeded passes over the benchmark.
[[environment]]
id = "GSM8K-full"
benchmark = "GSM8K"
roster = "full"
Theta = 0.764
T_max = 1319

[[environment]]
id = "GPQA-full"
benchmark = "GPQA"
roster = "full"
Theta = 0.079
T_max = 546

[[environment]]
id = "AIME-full"
benchmark = "AIME"
roster = "full"
Theta = 0.030
T_max = 933

[[environment]]
id = "GSM8K-ladder"
benchmark = "GSM8K"
roster = "ladder"
Theta = 0.805
T_max = 1319

[[environment]]
id = "GPQA-ladder"
benchmark = "GPQA"
roster = "ladder"
Theta = 0.2396
T_max = 545          # reward alignment drops one question

[[environment]]
id = "AIME-ladder"
benchmark = "AIME"
roster = "ladder"
Theta = 0.0189
T_max = 933

[[environment]]
id = "GSM8K-all"
benchmark = "GSM8K"
roster = "all"
Theta = 0.8094
T_max = 1319

[[environment]]
id = "GPQA-all"
benchmark = "GPQA"
roster = "all"
Theta = 0.265
T_max = 545

[[environment]]
id = "AIME-all"
benchmark = "AIME"
roster = "all"
Theta = 0.047
T_max = 933

[mechanism]
margin = 0.25        # price = (1 + margin) * cost; prices in cri/pricing.py
token_cap = 512
# C_max = 102.4      # unset: token_cap * max_i (N_i * price_i) per roster
delta = 0.05
gamma = 0.0          # 0 for empirical_mean; shrinkage needs its computed minimum

[provider]
estimator = "empirical_mean"   # "shrinkage" (shrinkage_k, prior_mean) | "biased" (bias)
# shrinkage_k = 10

[policies]
# Main: mechanism, uniform_random, cheapest_bid, quality_greedy, oracle_cheapest_qualified.
# Ablations: no_quality_filter, greedy_cheapest_qualified, pay_your_bid.
# Also available: cheapest_price, oracle_quality_random, gamma_zero, biased_beliefs,
# independent_cost_stream.
run = [
  "mechanism", "uniform_random", "cheapest_bid", "quality_greedy", "oracle_cheapest_qualified",
  "no_quality_filter", "greedy_cheapest_qualified", "pay_your_bid",
]

[checkpoints]
per_decade = 20      # log-spaced checkpoint rounds
landmarks = []

# Optional cross product over C_max, Theta, gamma, delta, margin:
# [sweep]
# C_max = [102.4, 150.0, 250.0]
